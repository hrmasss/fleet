[project]
name = "fleet"
version = "0.1.0"
description = "Runner-agnostic dispatch queue for agy, claude and cursor sessions"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
fleet = "fleet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300 flips `CONSTANT == literal` assertions, which reads backwards in a test.
ignore = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
